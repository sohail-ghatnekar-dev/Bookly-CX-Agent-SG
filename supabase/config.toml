# Unlisted keys use Supabase CLI defaults.
project_id = "bookly"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
enable_signup = true
enable_anonymous_sign_ins = true

[edge_runtime]
enabled = true
policy = "per_worker"
deno_version = 2

[functions.agent]
verify_jwt = true
